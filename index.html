<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAST GUARDIAN</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameCanvas {
            background-color: #050510;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GROUND_Y = 500;

    const keys = {
        left: false,
        right: false,
        jump: false,
        shoot: false
    };

    const player = {
        x: 100,
        y: GROUND_Y,
        width: 32,
        height: 48,
        color: '#00ffcc',
        speed: 5,
        vy: 0,
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: false,
        facing: 'right',   // 向いている方向 ('left' または 'right')
        shootCooldown: 0   // 連続発射を防止するためのクールダウンタイマー
    };

    // プレイヤーの弾を保持する配列（C言語の構造体配列のようなもの）
    const bullets = [];

    // --- キーボードイベントリスナー ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  keys.left = true;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === ' ' || e.key === 'ArrowUp')                    keys.jump = true;
        if (e.key === 'j' || e.key === 'J' || e.key === 'x' || e.key === 'X') keys.shoot = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  keys.left = false;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === ' ' || e.key === 'ArrowUp')                    keys.jump = false;
        if (e.key === 'j' || e.key === 'J' || e.key === 'x' || e.key === 'X') keys.shoot = false;
    });

    // --- 弾を生成する関数 ---
    function shootBullet() {
        if (player.shootCooldown > 0) return; // クールダウン中なら撃てない

        // 弾の初期位置と速度の設定
        const bulletSpeed = 12;
        const bx = player.facing === 'right' ? player.x + player.width : player.x - 12;
        const by = player.y + player.height / 2 - 4; // プレイヤーの中央の高さ

        bullets.push({
            x: bx,
            y: by,
            width: 12,
            height: 8,
            vx: player.facing === 'right' ? bulletSpeed : -bulletSpeed,
            color: '#ffff00' // レトロな黄色エネルギー弾
        });

        // クールダウン設定（フレーム数。60fpsなので12フレーム ≒ 約0.2秒間隔）
        player.shootCooldown = 12;
    }

    // --- ゲームの更新処理 ---
    function update() {
        // 1. 左右移動と向きの更新
        if (keys.left) {
            player.x -= player.speed;
            player.facing = 'left';
        }
        if (keys.right) {
            player.x += player.speed;
            player.facing = 'right';
        }

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) {
            player.x = canvas.width - player.width;
        }

        // 2. ジャンプ処理
        if (keys.jump && player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
        }

        // 3. 重力とY座標更新
        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
        }

        // 4. 射撃タイマーと弾生成
        if (player.shootCooldown > 0) {
            player.shootCooldown--;
        }
        if (keys.shoot) {
            shootBullet();
        }

        // 5. 弾の移動と画面外削除
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;

            // 画面外に出たら配列から削除（C言語でのfree/メモリ解放に相当）
            if (b.x < 0 || b.x > canvas.width) {
                bullets.splice(i, 1);
            }
        }
    }

    // --- 描画処理 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 床
        ctx.fillStyle = '#333';
        ctx.fillRect(0, GROUND_Y + player.height, canvas.width, canvas.height - (GROUND_Y + player.height));

        // プレイヤー
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // 向きがわかるように「目（バイザー）」を描画（レトロSF感UP）
        ctx.fillStyle = '#ffffff';
        const eyeX = player.facing === 'right' ? player.x + 20 : player.x + 4;
        ctx.fillRect(eyeX, player.y + 10, 8, 8);

        // 弾の描画
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.width, b.height);
        });
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
