<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAST GUARDIAN</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameCanvas {
            background-color: #050510;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GROUND_Y = 500;

    // --- ゲームの状態定数 ---
    const GAME_STATE = {
        TITLE: 'title',
        PLAYING: 'playing',
        CLEAR: 'clear',
        GAMEOVER: 'gameover'
    };
    let gameState = GAME_STATE.TITLE;

    // キー入力状態
    const keys = {
        left: false,
        right: false,
        jump: false,
        jumpPressed: false,
        shoot: false
    };

    // --- プレイヤーオブジェクト ---
    let player = {};
    function initPlayer() {
        player = {
            x: 100,
            y: GROUND_Y,
            width: 32,
            height: 48,
            color: '#00ffcc',
            speed: 5,
            vy: 0,
            gravity: 0.8,
            jumpPower: -12,
            isGrounded: false,
            jumpsLeft: 2,
            facing: 'right',
            shootCooldown: 0,
            maxHp: 5,
            hp: 5,
            invincibleTimer: 0
        };
    }

    // --- ボスオブジェクト ---
    let boss = {};
    function initBoss() {
        boss = {
            x: 600,
            y: 300,
            width: 140,
            height: 200,
            maxHp: 30,
            hp: 30,
            coreOpen: false,
            coreTimer: 0,
            coreOpenDuration: 120,
            coreCloseDuration: 180,
            flashTimer: 0,
            attackTimer: 0,
            attackInterval: 180,
            warningTimer: 0,
            warningDuration: 48,
            nextAttackType: 0,
            isPhase2: false
        };
    }

    // 配列初期化
    let bullets = [];
    let bossBullets = [];
    let particles = []; // 爆発・演出用パーティクル

    // ゲーム全体の初期化（リトライ時にも呼ぶ）
    function initGame() {
        initPlayer();
        initBoss();
        bullets = [];
        bossBullets = [];
        particles = [];
        gameState = GAME_STATE.PLAYING;
    }

    // 当たり判定 (AABB)
    function checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.width &&
            rect1.x + rect1.width > rect2.x &&
            rect1.y < rect2.y + rect2.height &&
            rect1.y + rect1.height > rect2.y
        );
    }

    // 被弾処理
    function damagePlayer(amount) {
        if (player.invincibleTimer > 0 || gameState !== GAME_STATE.PLAYING) return;

        player.hp -= amount;
        if (player.hp <= 0) {
            player.hp = 0;
            gameState = GAME_STATE.GAMEOVER;
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#00ffcc', 30);
        } else {
            player.invincibleTimer = 60; // 1秒間無敵
        }
    }

    // 爆発パーティクル生成関数
    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: Math.random() * 6 + 3,
                color: color,
                life: 30 // 30フレームで消去
            });
        }
    }

    // --- キー入力リスナー ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  keys.left = true;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === ' ' || e.key === 'ArrowUp') {
            if (!keys.jump) keys.jumpPressed = true;
            keys.jump = true;

            // タイトル画面でSpaceキーを押したらスタート
            if (gameState === GAME_STATE.TITLE) {
                initGame();
            }
        }
        if (e.key === 'j' || e.key === 'J' || e.key === 'x' || e.key === 'X') keys.shoot = true;

        // Rキーでリトライ（ゲームオーバー・クリア時、プレイ中いつでも）
        if (e.key === 'r' || e.key === 'R') {
            initGame();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  keys.left = false;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === ' ' || e.key === 'ArrowUp') {
            keys.jump = false;
            keys.jumpPressed = false;
        }
        if (e.key === 'j' || e.key === 'J' || e.key === 'x' || e.key === 'X') keys.shoot = false;
    });

    function shootBullet() {
        if (player.shootCooldown > 0) return;

        const bulletSpeed = 12;
        const bx = player.facing === 'right' ? player.x + player.width : player.x - 12;
        const by = player.y + player.height / 2 - 4;

        bullets.push({
            x: bx,
            y: by,
            width: 12,
            height: 8,
            vx: player.facing === 'right' ? bulletSpeed : -bulletSpeed,
            color: '#ffff00'
        });

        player.shootCooldown = 12;
    }

    function executeBossAttack(type) {
        const bx = boss.x;
        const by = boss.y + 100;

        if (type === 1) {
            const dx = (player.x + player.width / 2) - bx;
            const dy = (player.y + player.height / 2) - by;
            const angle = Math.atan2(dy, dx);
            const speed = boss.isPhase2 ? 9 : 7;

            bossBullets.push({
                x: bx,
                y: by,
                width: 16,
                height: 16,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: '#ff00ff'
            });
        } else if (type === 2) {
            const speed = boss.isPhase2 ? -8 : -6;
            bossBullets.push({
                x: boss.x,
                y: GROUND_Y + player.height - 30,
                width: 40,
                height: 30,
                vx: speed,
                vy: 0,
                color: '#ff3300'
            });
        } else if (type === 3) {
            const angles = boss.isPhase2
                ? [-0.6, -0.3, 0, 0.3, 0.6]
                : [-0.4, 0, 0.4];
            const speed = 6;
            angles.forEach(offsetAngle => {
                const angle = Math.PI + offsetAngle;
                bossBullets.push({
                    x: bx,
                    y: by,
                    width: 14,
                    height: 14,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: '#00ffff'
                });
            });
        }
    }

    // --- メイン更新処理 ---
    function update() {
        // パーティクルの更新（全状態共通）
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        if (gameState !== GAME_STATE.PLAYING) return;

        // 1. プレイヤー移動・動作
        if (keys.left) {
            player.x -= player.speed;
            player.facing = 'left';
        }
        if (keys.right) {
            player.x += player.speed;
            player.facing = 'right';
        }

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) {
            player.x = canvas.width - player.width;
        }

        if (keys.jumpPressed && player.jumpsLeft > 0) {
            player.vy = player.jumpPower;
            player.jumpsLeft--;
            player.isGrounded = false;
            keys.jumpPressed = false;
        }

        player.vy += player.gravity;
        player.y += player.vy;

        if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
            player.jumpsLeft = 2;
        }

        if (player.shootCooldown > 0) player.shootCooldown--;
        if (player.invincibleTimer > 0) player.invincibleTimer--;

        if (keys.shoot) shootBullet();

        // 2. ボスAI・弱点制御
        if (boss.hp <= boss.maxHp / 2) {
            boss.isPhase2 = true;
            boss.attackInterval = 110;
        }

        boss.coreTimer++;
        if (boss.coreOpen) {
            if (boss.coreTimer >= boss.coreOpenDuration) {
                boss.coreOpen = false;
                boss.coreTimer = 0;
            }
        } else {
            if (boss.coreTimer >= boss.coreCloseDuration) {
                boss.coreOpen = true;
                boss.coreTimer = 0;
            }
        }

        if (boss.flashTimer > 0) boss.flashTimer--;

        boss.attackTimer++;
        if (boss.warningTimer > 0) {
            boss.warningTimer--;
            if (boss.warningTimer === 0) {
                executeBossAttack(boss.nextAttackType);
            }
        } else if (boss.attackTimer >= boss.attackInterval) {
            boss.attackTimer = 0;
            boss.nextAttackType = Math.floor(Math.random() * 3) + 1;
            boss.warningTimer = boss.warningDuration;
        }

        // 3. プレイヤー弾移動・対ボス判定
        const bossCoreRect = {
            x: boss.x - 5,
            y: boss.y + 80,
            width: 45,
            height: 60
        };

        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;

            if (checkCollision(b, boss)) {
                if (boss.coreOpen && checkCollision(b, bossCoreRect)) {
                    boss.hp -= 1;
                    boss.flashTimer = 5;
                    createExplosion(b.x, b.y, '#ffcc00', 5);

                    // 勝利判定！
                    if (boss.hp <= 0) {
                        boss.hp = 0;
                        gameState = GAME_STATE.CLEAR;
                        createExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, '#ff3300', 80);
                    }
                }
                bullets.splice(i, 1);
                continue;
            }

            if (b.x < 0 || b.x > canvas.width) {
                bullets.splice(i, 1);
            }
        }

        // 4. ボス弾移動・対プレイヤー判定
        for (let i = bossBullets.length - 1; i >= 0; i--) {
            const bb = bossBullets[i];
            bb.x += bb.vx;
            bb.y += bb.vy;

            if (checkCollision(bb, player)) {
                damagePlayer(1);
                bossBullets.splice(i, 1);
                continue;
            }

            if (bb.x < -50 || bb.x > canvas.width + 50 || bb.y < -50 || bb.y > canvas.height + 50) {
                bossBullets.splice(i, 1);
            }
        }

        if (checkCollision(player, boss)) {
            damagePlayer(1);
        }
    }

    // --- メイン描画処理 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 床
        ctx.fillStyle = '#333';
        ctx.fillRect(0, GROUND_Y + 48, canvas.width, canvas.height - (GROUND_Y + 48));

        // パーティクルの描画
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        // --- タイトル画面 ---
        if (gameState === GAME_STATE.TITLE) {
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ffcc';
            ctx.font = '36px Courier New';
            ctx.fillText('LAST GUARDIAN', canvas.width / 2, 180);

            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Courier New';
            ctx.fillText('PRESS SPACE TO START', canvas.width / 2, 280);

            // 操作説明
            ctx.fillStyle = '#aaa';
            ctx.font = '14px Courier New';
            ctx.fillText('--- CONTROLS ---', canvas.width / 2, 380);
            ctx.fillText('MOVE   : A / D  or  LEFT / RIGHT', canvas.width / 2, 410);
            ctx.fillText('JUMP   : SPACE  or  UP (2-Jump Available)', canvas.width / 2, 440);
            ctx.fillText('SHOOT  : J  or  X', canvas.width / 2, 470);
            ctx.fillText('RETRY  : R', canvas.width / 2, 500);
            ctx.textAlign = 'left';
            return;
        }

        // --- プレイヤー描画 ---
        if (gameState === GAME_STATE.PLAYING || gameState === GAME_STATE.CLEAR) {
            if (player.invincibleTimer === 0 || Math.floor(player.invincibleTimer / 4) % 2 === 0) {
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = '#ffffff';
                const eyeX = player.facing === 'right' ? player.x + 20 : player.x + 4;
                ctx.fillRect(eyeX, player.y + 10, 8, 8);
            }
        }

        // プレイヤー弾
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.width, b.height);
        });

        // --- ボス描画 ---
        if (gameState === GAME_STATE.PLAYING || gameState === GAME_STATE.GAMEOVER) {
            if (boss.flashTimer > 0) {
                ctx.fillStyle = '#ff4444';
            } else if (boss.isPhase2) {
                ctx.fillStyle = '#883344';
            } else {
                ctx.fillStyle = '#444466';
            }
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

            if (boss.warningTimer > 0) {
                ctx.fillStyle = (Math.floor(boss.warningTimer / 4) % 2 === 0) ? '#ff0000' : '#ffff00';
                ctx.fillRect(boss.x + 10, boss.y + 20, 120, 30);
            } else {
                ctx.fillStyle = '#222233';
                ctx.fillRect(boss.x + 20, boss.y + 20, 100, 30);
            }

            if (boss.coreOpen) {
                ctx.fillStyle = '#ff3300';
                ctx.fillRect(boss.x - 5, boss.y + 80, 45, 60);
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(boss.x + 5, boss.y + 90, 25, 40);
            } else {
                ctx.fillStyle = '#111122';
                ctx.fillRect(boss.x - 5, boss.y + 80, 45, 60);
                ctx.fillStyle = '#333344';
                ctx.fillRect(boss.x - 5, boss.y + 105, 45, 8);
            }
        }

        // ボス弾
        bossBullets.forEach(bb => {
            ctx.fillStyle = bb.color;
            ctx.fillRect(bb.x, bb.y, bb.width, bb.height);
        });

        // --- UI 描画 ---
        ctx.fillStyle = '#fff';
        ctx.font = '16px Courier New';
        ctx.fillText('PLAYER HP:', 20, 30);
        for (let i = 0; i < player.maxHp; i++) {
            ctx.fillStyle = i < player.hp ? '#00ffcc' : '#333333';
            ctx.fillRect(130 + i * 22, 16, 18, 18);
        }

        const bossTitle = boss.isPhase2 ? 'BOSS: LAST GUARDIAN [OVERDRIVE]' : 'BOSS: LAST GUARDIAN';
        ctx.fillStyle = boss.isPhase2 ? '#ff4444' : '#ffffff';
        ctx.fillText(bossTitle, 420, 30);

        ctx.strokeStyle = '#fff';
        ctx.strokeRect(450, 40, 300, 16);

        const hpWidth = (boss.hp / boss.maxHp) * 300;
        ctx.fillStyle = boss.isPhase2 ? '#ff0055' : '#00ff66';
        ctx.fillRect(450, 40, hpWidth, 16);

        // 画面下部の簡易操作ヘルプ
        ctx.fillStyle = '#666';
        ctx.font = '12px Courier New';
        ctx.fillText('MOVE: A/D | JUMP: Space | SHOOT: J/X | RETRY: R', 20, 585);

        // --- ゲームオーバー画面 ---
        if (gameState === GAME_STATE.GAMEOVER) {
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff3333';
            ctx.font = '40px Courier New';
            ctx.fillText('GAME OVER', canvas.width / 2, 250);

            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Courier New';
            ctx.fillText('PRESS R TO RETRY', canvas.width / 2, 320);
            ctx.textAlign = 'left';
        }

        // --- 勝利画面 ---
        if (gameState === GAME_STATE.CLEAR) {
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00ffcc';
            ctx.font = '40px Courier New';
            ctx.fillText('MISSION COMPLETE!', canvas.width / 2, 230);

            ctx.fillStyle = '#ffff00';
            ctx.font = '20px Courier New';
            ctx.fillText('GUARDIAN DESTROYED', canvas.width / 2, 280);

            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Courier New';
            ctx.fillText('PRESS R TO PLAY AGAIN', canvas.width / 2, 350);
            ctx.textAlign = 'left';
        }
    }

    // メインゲームループ
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // 初期実行（タイトル画面で開始）
    initPlayer();
    initBoss();
    gameLoop();
</script>
</body>
</html>
